<rect width="1000" height="346" rx="18" fill="url(#bg)"/><rect width="1000" height="346" rx="18" fill="url(#glow)"/>
<circle cx="60" cy="40" r="3" fill="#fef08a" opacity=".7"><animate attributeName="opacity" values=".2;.9;.2" dur="3s" repeatCount="indefinite"/></circle>
<text x="48" y="64" font-size="14" letter-spacing="3" fill="#fef08a" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-weight="700">DEVOPS BOOTCAMP · LAB</text>
<text x="48" y="112" font-size="40" font-weight="800" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Terraform: Adopt the</text>
<text x="48" y="160" font-size="40" font-weight="800" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Bucket Nobody Documented</text>
<text x="48" y="190" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">An intern created the Clippy exports bucket by hand in the console. It</text>
<text x="48" y="212" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">has customer data in it, no versioning, no tags and no rules, and</text>
<text x="48" y="234" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">nobody remembers the settings. Bring it under Terraform without losing</text>
<text x="48" y="256" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">a single file, make it safe in code, and catch the colleague who…</text>
<rect x="48" y="288" width="105" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#fef08a" stroke-opacity=".7"/><text x="62" y="309" font-size="14" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">75-90 min</text>
<rect x="165" y="288" width="225" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#fef08a" stroke-opacity=".7"/><text x="179" y="309" font-size="14" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Cost: free (S3 pennies)</text>
<g transform="translate(750,73)">
